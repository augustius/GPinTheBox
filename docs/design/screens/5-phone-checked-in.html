<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Phone — checked in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F2EA}
a{color:#2E6A4A}a:hover{color:#1F4D35}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; color: #1F1D1A; background: #F6F2EA; -webkit-font-smoothing: antialiased; font-size: 17px; line-height: 1.4; padding: 64px 24px 32px; display: flex; flex-direction: column; align-items: center; text-align: center">

<div style="margin-top: 150px; display: flex; flex-direction: column; align-items: center; gap: 20px">
<svg role="img" aria-label="Checked in" width="72" height="72" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2E6A4A"></circle><path d="M7 12.5l3.2 3.2L17 8.8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2">You’re checked in</h1>
<p style="margin: 0; max-width: 290px; font-size: 17px; color: #3D3934">Take a seat. Dr Williams will call your name.</p>
</div>

<dl style="margin: 40px 0 0; width: 100%; border-radius: 12px; background: #FFFCF6; text-align: left; overflow: hidden">
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #ECE5D8"><dt style="color: #66605A">Name</dt><dd style="margin: 0">Paul Smith</dd></div>
<div style="display: flex; justify-content: space-between; gap: 12px; padding: 13px 16px"><dt style="color: #66605A">Arrived</dt><dd style="margin: 0; font-variant-numeric: tabular-nums">9:05 am</dd></div>
</dl>

<p style="margin: auto 0 0; font-size: 15px; color: #66605A">Something wrong? Let the front desk know.</p>
</div>
</body>
</html>
