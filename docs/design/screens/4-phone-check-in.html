<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Phone — check-in form</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F2EA}
a{color:#2E6A4A}a:hover{color:#1F4D35}
button{cursor:pointer}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; color: #1F1D1A; background: #F6F2EA; -webkit-font-smoothing: antialiased; font-size: 17px; line-height: 1.4; padding: 64px 20px 32px; display: flex; flex-direction: column; gap: 24px">

<div style="padding: 0 4px">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15">Check in</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #66605A">Your answers go only to your doctor’s computer in this clinic.</p>
</div>

<form style="display: flex; flex-direction: column; gap: 22px">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0 16px 6px; font-size: 13px; color: #66605A">About you</legend>
<div style="border-radius: 12px; background: #FFFCF6; overflow: hidden">
<div style="padding: 10px 16px 9px; border-bottom: 1px solid #ECE5D8">
<label for="name" style="display: block; font-size: 13px; color: #66605A">Full name</label>
<input id="name" type="text" value="Paul Smith" autocomplete="name" style="width: 100%; border: 0; padding: 2px 0 0; background: transparent; font: inherit; font-size: 17px; color: #1F1D1A; outline: none">
</div>
<div style="padding: 10px 16px 9px; border-bottom: 1px solid #ECE5D8">
<label for="dob" style="display: block; font-size: 13px; color: #66605A">Date of birth</label>
<input id="dob" type="text" inputmode="numeric" value="05 / 07 / 1933" autocomplete="bday" style="width: 100%; border: 0; padding: 2px 0 0; background: transparent; font: inherit; font-size: 17px; color: #1F1D1A; outline: none; font-variant-numeric: tabular-nums">
</div>
<div style="padding: 10px 16px 9px">
<label for="medicare" style="display: block; font-size: 13px; color: #66605A">Medicare number</label>
<input id="medicare" type="text" inputmode="numeric" value="4188 44728 5 · 1" style="width: 100%; border: 0; padding: 2px 0 0; background: transparent; font: inherit; font-size: 17px; color: #1F1D1A; outline: none; font-variant-numeric: tabular-nums">
</div>
</div>
</fieldset>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0 16px 6px; font-size: 13px; color: #66605A">Today</legend>
<div style="border-radius: 12px; background: #FFFCF6; overflow: hidden">
<div style="padding: 10px 16px 12px; border-bottom: 1px solid #ECE5D8">
<label for="reason" style="display: block; font-size: 13px; color: #66605A">What brings you in?</label>
<textarea id="reason" rows="3" style="width: 100%; box-sizing: border-box; border: 0; padding: 2px 0 0; background: transparent; font: inherit; font-size: 17px; line-height: 1.4; color: #1F1D1A; outline: none; resize: none">Still not sleeping well. Want to talk about my cholesterol tablet.</textarea>
</div>
<div style="padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span id="medsq" style="font-size: 17px">Medicines changed?</span>
<div role="group" aria-labelledby="medsq" style="display: flex; padding: 2px; border-radius: 9px; background: #E8E1D3">
<button type="button" aria-pressed="true" style="min-width: 56px; height: 32px; border: 0; border-radius: 7px; background: #FFFCF6; box-shadow: 0 1px 2px rgba(31,29,26,0.12); font: inherit; font-size: 15px; font-weight: 600; color: #1F1D1A">No</button>
<button type="button" aria-pressed="false" style="min-width: 56px; height: 32px; border: 0; border-radius: 7px; background: transparent; font: inherit; font-size: 15px; color: #1F1D1A">Yes</button>
</div>
</div>
</div>
</fieldset>
</form>

<a href="5-phone-checked-in.html" style="margin-top: auto; height: 52px; border-radius: 14px; background: #2E6A4A; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Send to the doctor</a>
</div>
</body>
</html>
